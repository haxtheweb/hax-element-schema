content: >-
  <p>hax-element-schema is one of several schema specifications in the HAX
  ecosystem. Explore the others:</p>

  <ul>

  <li><a href="https://haxtheweb.github.io/json-outline-schema/">JSON Outline
  Schema</a> — the content structure, site navigation, and metadata schema used
  by HAXcms.</li>

  <li><a href="https://haxtheweb.github.io/hax-schema/">HAX Schema</a> — the
  full haxProperties contract for element authoring.</li>

  <li><a href="https://haxtheweb.github.io/merlin-schema/">Merlin Schema</a> —
  the command-palette and voice-assistant Option/Program schema.</li>

  <li><a href="https://haxtheweb.github.io/appstore-spec/">Appstore Spec</a> —
  the schema for external media providers, upload targets, stax templates, and
  autoloaded elements.</li>

  </ul>

  <p>New to HAX? <a href="https://haxtheweb.org/">Get started with HAX</a>.</p>
